# ==============================================================================
# BASIC EXAMPLE: Deployment in consumer projects
# Copy this file to your project at: .github/workflows/deploy.yml
# ==============================================================================
name: CI/CD Pipeline

on:
  push:
    branches:
      - main

# Required permissions to publish images to GitHub Packages (GHCR)
permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Build & Deploy
    # Replace 'YOUR_ORG_OR_USERNAME' with the owner of the pachas-devops repository
    uses: YOUR_ORG_OR_USERNAME/pachas-devops/.github/workflows/docker-build-deploy.yml@main
    secrets: inherit
    with:
      deploy_mode: 'compose'
      deploy_path: '/home/deploy/apps/my-project'

# ==============================================================================
# PLANTILLA DE DOCKER COMPOSE PARA EL SERVIDOR REMOTO
# Coloca este archivo en el servidor en la ruta definida en `deploy_path`
# (por ejemplo: /home/deploy/apps/mi-proyecto/docker-compose.yml)
# ==============================================================================
services:
  web:
    # Sustituye con tu usuario/organización y nombre del repositorio en minúsculas
    image: ghcr.io/tu-usuario/tu-repositorio:latest
    container_name: mi-proyecto-web
    restart: unless-stopped
    ports:
      - "8080:80"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

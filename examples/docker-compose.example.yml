# ==============================================================================
# DOCKER COMPOSE TEMPLATE FOR REMOTE SERVER
# Place this file on your target server inside `deploy_path`
# (e.g., /home/deploy/apps/my-project/docker-compose.yml)
# ==============================================================================
services:
  web:
    # Replace with your GitHub organization/username and lowercase repository name
    image: ghcr.io/your-user/your-repository:latest
    container_name: my-project-web
    restart: unless-stopped
    ports:
      - "8080:80"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

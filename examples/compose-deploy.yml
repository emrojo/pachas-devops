# ==============================================================================
# ADVANCED EXAMPLE: Deployment with Environments, .env Injection and Compose
# Copy this file to your project at: .github/workflows/deploy-production.yml
# ==============================================================================
name: Deploy to Production

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  production-deploy:
    name: Production Release
    # Replace 'YOUR_ORG_OR_USERNAME' with the owner of the pachas-devops repository
    uses: YOUR_ORG_OR_USERNAME/pachas-devops/.github/workflows/docker-build-deploy.yml@v1
    with:
      environment: 'production'
      dockerfile: './docker/Dockerfile'
      context: '.'
      deploy_mode: 'compose'
      deploy_path: '/opt/apps/my-project'
      compose_file: 'docker-compose.prod.yml'
      # Specify service names if you only want to recreate specific services (e.g. 'web'):
      compose_services: 'web'
    secrets:
      SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      SSH_USER: ${{ secrets.PROD_SSH_USER }}
      SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      # Optional: Injects raw .env file contents onto the server before 'docker compose up'
      ENV_CONTENT: ${{ secrets.PROD_ENV_FILE }}

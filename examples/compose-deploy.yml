# ==============================================================================
# EJEMPLO AVANZADO: Despliegue con Environments, Inyección de .env y Compose
# Copia este archivo en tu proyecto en: .github/workflows/deploy-production.yml
# ==============================================================================
name: Deploy to Production

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  production-deploy:
    name: Production Release
    # Sustituye 'ORGANIZACION_O_USUARIO' por el dueño del repo pachas-devops
    uses: ORGANIZACION_O_USUARIO/pachas-devops/.github/workflows/docker-build-deploy.yml@v1
    with:
      environment: 'production'
      dockerfile: './docker/Dockerfile'
      context: '.'
      deploy_mode: 'compose'
      deploy_path: '/opt/apps/mi-proyecto'
      compose_file: 'docker-compose.prod.yml'
      # Si solo quieres recrear el servicio 'web' sin reiniciar la base de datos:
      compose_services: 'web'
    secrets:
      SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      SSH_USER: ${{ secrets.PROD_SSH_USER }}
      SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      # Opcional: Inyecta el contenido del .env en el servidor antes del 'docker compose up'
      ENV_CONTENT: ${{ secrets.PROD_ENV_FILE }}
